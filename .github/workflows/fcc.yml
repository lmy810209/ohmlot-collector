name: fcc-collect

# Manual only. FCC sources (fccid.io, fcc.report, apps.fcc.gov) currently block unattended clients,
# so this is not on the daily schedule. Run it from Actions → fcc-collect → Run workflow.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect FCC grants
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run collect:fcc
      - name: Commit FCC snapshot
        if: always()
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/fcc
          git diff --cached --quiet || git commit -m "fcc snapshot $(date -u +%F)"
          git pull --rebase -q
          git push
