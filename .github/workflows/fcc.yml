name: fcc-collect

# Weekly on Mondays (01:00 UTC = 10:00 KST) plus manual runs from Actions → fcc-collect → Run workflow.
# Reads the official FCC OET Laboratory Services API (KDB 953436, getFCCIDList); see context/fcc-api-notes.md.
# A blocked run (HTTP 403 / HTML instead of JSON) is logged and skipped — nothing is bypassed, and when no
# grantee code answers nothing is written to data/.
on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect FCC grants (official API)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run collect:fcc
      - name: Commit FCC snapshot
        if: always()
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/fcc data/models.json
          git diff --cached --quiet || git commit -m "fcc snapshot $(date -u +%F)"
          git pull --rebase -q
          git push
