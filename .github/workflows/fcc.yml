name: fcc-collect

# Weekly + manual. Reads PSHSB public notices from docs.fcc.gov (the only FCC host reachable from
# runners) and extracts Conditional Approvals; see context/fcc-api-notes.md for why EAS is not used.
on:
  schedule:
    - cron: "0 1 * * 1"   # Mondays 01:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect FCC notices
        run: npm run collect:fcc
      - name: Commit FCC data
        if: always()
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data/fcc
          git diff --cached --quiet || git commit -m "fcc notices $(date -u +%F)"
          git pull --rebase -q
          git push
