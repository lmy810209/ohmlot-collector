name: intraday-collect

# task-measure.md §B: 6-hourly (4x/day) observation for exactly the 3 Tier A sources named in
# src/intraday.ts's TIER_A_MODEL_IDS — never expanded to more. Offset 30 minutes from daily.yml's own
# 00:17 UTC trigger (here: :47) so the two workflows' `git add`/`git push` steps don't race each other; each
# scopes its own commit to disjoint paths regardless (this one never touches data/prices/<date>.jsonl,
# data/events.jsonl, or data/fcc — only data/prices/intraday, its own log, and the circuit-breaker flag).
# Writes NOTHING to Supabase and never touches data/events.jsonl — see src/intraday.ts's own comments for why.
on:
  schedule:
    - cron: "47 */6 * * *"   # 00:47, 06:47, 12:47, 18:47 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect intraday snapshot (Tier A only)
        run: npm run collect:intraday
      - name: Commit intraday data
        if: always()
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          # data/prices/intraday is always written by the collect step above; data/logs and the circuit-
          # breaker flag are only created when something actually goes wrong, so a bare `git add` on either
          # fails with "did not match any files" (exit 128) on every clean run — the common case — and that
          # aborts this script before commit/push ever execute, silently discarding the collected data. Add
          # them only when they exist.
          git add data/prices/intraday
          [ -d data/logs ] && git add data/logs
          [ -f data/intraday-disabled.json ] && git add data/intraday-disabled.json
          git diff --cached --quiet || git commit -m "intraday snapshot $(date -u +%FT%H:%M)"
          git pull --rebase -q
          git push
