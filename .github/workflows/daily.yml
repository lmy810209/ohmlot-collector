name: daily-collect

on:
  schedule:
    - cron: "17 0 * * *"   # every day 00:17 UTC (09:17 KST)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Collect prices
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run collect:prices
      - name: Commit snapshot (timestamped archive)
        if: always()
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "snapshot $(date -u +%F)"
          git pull --rebase -q
          git push
